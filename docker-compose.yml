services:
  uzdoom:
    # Build from specific engine
    build:
      context: ./engines/uzdoom
    container_name: doom-engine
    # Run as the host user (UID/GID come from the .env written by run.sh) so
    # config and saves stay owned by you, and the Wayland/PulseAudio sockets
    # accept the connection without extra grants.
    # Supplementary groups for /dev/dri and /dev/snd are added by the
    # docker-compose.override.yml that run.sh generates for this host.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # World-writable home created in the image; the engine keeps its
      # cache there. Config and saves are passed explicitly (see Dockerfile).
      - HOME=/home/doom
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
      # Audio vars
      - PULSE_SERVER=unix:/tmp/pulse-socket
      - PULSE_COOKIE=/tmp/pulse-cookie
      - SDL_AUDIODRIVER=pulseaudio
      # Native Wayland by default (proper fullscreen). Override per run with
      # `SDL_VIDEODRIVER=x11 ./run.sh`: on Wayland the engine's error/startup
      # dialogs can't create an SDL renderer in the container and crash
      # instead of showing (see README Troubleshooting); X11 shows them, but
      # the game then opens as a normal window, not fullscreen.
      - SDL_VIDEODRIVER=${SDL_VIDEODRIVER:-wayland}
    volumes:
      # --- SYSTEM (GFX and Audio) ---
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/tmp/runtime-dir/${WAYLAND_DISPLAY}
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # --- AUDIO FIX ---
      # Mount the socket
      - ${XDG_RUNTIME_DIR}/pulse/native:/tmp/pulse-socket
      # Mount the cookie
      - ${PULSE_COOKIE_HOST}:/tmp/pulse-cookie:ro

      # --- YOUR WADS AND MODS HERE ---
      # 1. (IWADS)
      - ./original_wads:/games/iwads
      # 2. Maps
      - ./map_wads:/games/maps
      # 3. Gameplay Mods
      - ./mods:/games/mods
      # 4. Persistent config and saves
      - ./config:/config

    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # --- LAUNCH COMMAND ---
    # Adjust based on the wad and file you want to load. Pending to create a proper entrypoint to handle this.
    # Project Brutality must be 0.4.1 or newer: earlier builds deliberately
    # abort on GZDoom 4.13+/UZDoom. Get it from
    # https://github.com/pa1nki113r/Project_Brutality/archive/refs/tags/0.4.1.zip
    command: >
      -iwad /games/iwads/DOOM.WAD
      -file
      /games/mods/Project_Brutality-0.4.1.zip
      /games/mods/IDKFA_Soundtrack_Mod_v2/WAD/IDKFAv2.wad
      /games/mods/zdoom-dhtp-20180514.pk3
